openapi: 3.0.3
info:
  title: User Management API
  version: 1.0.0
  description: OpenAPI specification for user-management module routes.
servers:
  - url: http://localhost:8000
tags:
  - name: Users
  - name: Prompts
  - name: Glimpses
  - name: Interaction
paths:
  /users:
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created or existing user returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    get:
      tags: [Users]
      summary: List users with filters
      parameters:
        - $ref: "#/components/parameters/UserIDQuery"
        - name: age_range
          in: query
          description: Comma-separated age range (e.g. 21,30)
          schema:
            type: string
        - name: distance
          in: query
          schema:
            type: number
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Filtered users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserWithGlimpses"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /users/{userID}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
        - name: fields
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    put:
      tags: [Users]
      summary: Update user
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    delete:
      tags: [Users]
      summary: Delete user
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /users/{userID}/prompts:
    post:
      tags: [Prompts]
      summary: Insert prompts in bulk
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertPromptsBody"
      responses:
        "201":
          description: Prompts inserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /users/{userID}/prompts/{promptID}:
    put:
      tags: [Prompts]
      summary: Update prompt
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
        - $ref: "#/components/parameters/PromptIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromptBody"
      responses:
        "200":
          description: Prompt updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    delete:
      tags: [Prompts]
      summary: Delete prompt
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
        - $ref: "#/components/parameters/PromptIDPath"
      responses:
        "200":
          description: Prompt deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /users/{userID}/likers:
    get:
      tags: [Interaction]
      summary: List users who liked this user
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      responses:
        "200":
          description: Likers list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /users/{userID}/glimpses:
    get:
      tags: [Glimpses]
      summary: List glimpses for user
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      responses:
        "200":
          description: Glimpse list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Glimpse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    post:
      tags: [Glimpses]
      summary: Create glimpse
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateGlimpseBody"
      responses:
        "201":
          description: Glimpse created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /users/{userID}/glimpses/{glimpseID}:
    delete:
      tags: [Glimpses]
      summary: Delete glimpse
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
        - $ref: "#/components/parameters/GlimpseIDPath"
      responses:
        "200":
          description: Glimpse deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /interaction/like:
    post:
      tags: [Interaction]
      summary: Create like interaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionLikeBody"
      responses:
        "200":
          description: Interaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionRecordedResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /interaction/dislike:
    post:
      tags: [Interaction]
      summary: Create dislike interactions in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionDislikeBody"
      responses:
        "200":
          description: Interaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionRecordedResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
components:
  responses:
    BadRequestResponse:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundResponse:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerErrorResponse:
      description: Unexpected server-side failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    UserIDPath:
      name: userID
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    UserIDQuery:
      name: userID
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    PromptIDPath:
      name: promptID
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    GlimpseIDPath:
      name: glimpseID
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
  schemas:
    ObjectId:
      type: string
      pattern: "^[a-fA-F0-9]{24}$"
    ErrorResponse:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: User not found
        fields:
          type: object
          additionalProperties:
            type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    MessageWithResultResponse:
      type: object
      required: [message, result]
      properties:
        message:
          type: string
        result:
          type: object
          additionalProperties: true
    InteractionRecordedResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Interaction recorded
    Prompt:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
        answer:
          type: string
    Coordinates:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
    Location:
      type: object
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          $ref: "#/components/schemas/Coordinates"
    PlaceOfBirth:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
    Interests:
      type: object
      properties:
        coreActivities:
          type: array
          items:
            type: string
        mediaConsumption:
          type: array
          items:
            type: string
        lifestyle:
          type: array
          items:
            type: string
        datingPreferences:
          type: array
          items:
            type: string
    User:
      type: object
      required: [_id, userID]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        userID:
          type: string
        name:
          type: string
          nullable: true
        dob:
          type: string
          format: date-time
          nullable: true
        place_of_birth:
          $ref: "#/components/schemas/PlaceOfBirth"
        gender:
          type: string
          nullable: true
        orientation:
          type: string
          nullable: true
        bio:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/Prompt"
        interests:
          $ref: "#/components/schemas/Interests"
        event:
          type: string
          nullable: true
        persona:
          type: string
        isActive:
          type: boolean
        lastActive:
          type: string
          format: date-time
        isProfileComplete:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: boolean
        deletedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    UserWithGlimpses:
      type: object
      allOf:
        - $ref: "#/components/schemas/User"
      properties:
        glimpses:
          type: array
          items:
            $ref: "#/components/schemas/Glimpse"
    Glimpse:
      type: object
      required: [_id, userID, imageURL]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        userID:
          $ref: "#/components/schemas/ObjectId"
        imageURL:
          type: string
          format: uri
        caption:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: boolean
        deletedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    CreateUserBody:
      type: object
      required: [uid]
      properties:
        uid:
          type: string
          minLength: 1
    UpdateUserBody:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        dob:
          type: string
          format: date-time
        gender:
          type: string
        orientation:
          type: string
        bio:
          type: string
          maxLength: 500
        event:
          type: string
        persona:
          type: string
        isActive:
          type: boolean
        place_of_birth:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number
        location:
          type: object
          properties:
            type:
              type: string
              enum: [Point]
            coordinates:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
        interests:
          type: object
          properties:
            coreActivities:
              type: array
              items:
                type: string
            mediaConsumption:
              type: array
              items:
                type: string
            lifestyle:
              type: array
              items:
                type: string
            datingPreferences:
              type: array
              items:
                type: string
    InsertPromptsBody:
      type: object
      required: [prompts]
      properties:
        prompts:
          type: array
          minItems: 1
          items:
            type: object
            required: [question, answer]
            properties:
              question:
                type: string
                minLength: 1
              answer:
                type: string
                minLength: 1
    UpdatePromptBody:
      type: object
      required: [prompts]
      properties:
        prompts:
          type: object
          required: [question, answer]
          properties:
            question:
              type: string
              minLength: 1
            answer:
              type: string
              minLength: 1
    CreateGlimpseBody:
      type: object
      required: [image]
      properties:
        image:
          type: string
          format: binary
        caption:
          type: string
          maxLength: 100
    InteractionLikeBody:
      type: object
      required: [from, to]
      properties:
        from:
          $ref: "#/components/schemas/ObjectId"
        to:
          $ref: "#/components/schemas/ObjectId"
        comment:
          type: object
          properties:
            glimpse:
              $ref: "#/components/schemas/ObjectId"
            prompt:
              type: object
              properties:
                question:
                  type: string
                answer:
                  type: string
            answer:
              type: string
    InteractionDislikeBody:
      type: object
      required: [from, dislikedIds]
      properties:
        from:
          $ref: "#/components/schemas/ObjectId"
        dislikedIds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ObjectId"
