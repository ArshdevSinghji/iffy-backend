openapi: 3.0.3
info:
  title: Chat Management API
  version: 1.0.0
  description: OpenAPI specification for chat-management module routes.
servers:
  - url: "http://localhost:8000"
tags:
  - name: Chats
paths:
  /chats:
    get:
      tags: [Chats]
      summary: List rooms for a user
      parameters:
        - name: userID
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Room list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomSummary"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /chats/{roomId}:
    get:
      tags: [Chats]
      summary: List chat messages for a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated chat messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedChatsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
components:
  responses:
    InternalServerErrorResponse:
      description: Unexpected server-side failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ObjectId:
      type: string
      pattern: "^[a-fA-F0-9]{24}$"
    ErrorResponse:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: INTERNAL_SERVER_ERROR
        message:
          type: string
          example: An unexpected error occurred
        fields:
          type: object
          additionalProperties:
            type: string
    Partner:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        glimpses:
          type: array
          items:
            type: object
            properties:
              imageURL:
                type: string
                format: uri
    LastMessage:
      type: object
      properties:
        text:
          type: string
        sender_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    RoomSummary:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        partner:
          $ref: "#/components/schemas/Partner"
        lastMessage:
          $ref: "#/components/schemas/LastMessage"
        unreadCount:
          type: integer
        isDeleted:
          type: boolean
      additionalProperties: false
    PaginatedChatsResponse:
      type: object
      required: [chats, total]
      properties:
        chats:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        total:
          type: integer
    ChatMessage:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        room_id:
          $ref: "#/components/schemas/ObjectId"
        sender_id:
          $ref: "#/components/schemas/ObjectId"
        text:
          type: string
        status:
          type: string
          enum: [sent, delivered, read]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
